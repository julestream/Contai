<svg viewBox="0 0 390 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="g-disp">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="g-soft">
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="390" height="100" fill="#FFFFFF"/>

  <!-- Circle -->
  <circle cx="158" cy="50" r="40" fill="none" stroke="#B83018" stroke-width="13" filter="url(#g-disp)" opacity="0.9"/>
  <circle cx="158" cy="50" r="40" fill="none" stroke="#D84828" stroke-width="6" filter="url(#g-soft)" opacity="0.75"/>

  <!-- Diagonal slash -->
  <path d="M48,85 L256,18" stroke="#C8943A" stroke-width="11" stroke-linecap="round" filter="url(#g-disp)" opacity="0.85"/>
  <path d="M53,83 L251,20" stroke="#E8B458" stroke-width="5" stroke-linecap="round" filter="url(#g-soft)" opacity="0.7"/>

  <!-- Rectangle block -->
  <rect x="226" y="26" width="107" height="52" rx="1" fill="#1E3050" filter="url(#g-disp)" opacity="0.88"/>
  <rect x="229" y="29" width="101" height="46" rx="1" fill="#2A4870" filter="url(#g-soft)" opacity="0.6"/>

  <!-- Block highlight -->
  <path d="M230,35 Q262,31 327,33" stroke="#E8DCC8" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M231,38 Q263,35 325,37" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Circle highlight -->
  <path d="M133,37 Q157,31 180,38" stroke="#F5EED8" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M138,41 Q157,36 178,42" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.65"/>

  <!-- Knife accent -->
  <path d="M83,70 L100,65 L103,74 L86,79 Z" fill="#C8943A" opacity="0.9" filter="url(#g-soft)"/>
</svg>
