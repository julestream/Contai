<svg viewBox="0 0 390 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="s-disp">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="s-soft">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="390" height="100" fill="#FFFFFF"/>

  <!-- Plinth -->
  <path d="M90,85 Q195,80 300,85" stroke="#8A7A68" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#s-disp)" opacity="0.9"/>
  <path d="M100,82 Q195,77 287,82" stroke="#A89880" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#s-soft)" opacity="0.7"/>

  <!-- Torso verticals -->
  <path d="M156,83 Q152,66 154,48 Q156,32 163,22" stroke="#9A8870" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#s-disp)" opacity="0.85"/>
  <path d="M174,83 Q170,65 172,46 Q174,30 179,20" stroke="#B0A080" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#s-soft)" opacity="0.75"/>
  <path d="M192,83 Q189,66 190,48 Q191,33 194,22" stroke="#C8B898" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#s-disp)" opacity="0.7"/>
  <path d="M208,82 Q206,66 207,48 Q208,33 211,22" stroke="#A89070" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#s-soft)" opacity="0.65"/>
  <path d="M225,81 Q224,65 225,47 Q226,33 229,22" stroke="#9A8870" stroke-width="13" fill="none" stroke-linecap="round" filter="url(#s-disp)" opacity="0.7"/>

  <!-- Arms -->
  <path d="M110,54 Q138,50 160,52" stroke="#B8A888" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#s-soft)" opacity="0.7"/>
  <path d="M228,52 Q250,50 278,55" stroke="#B8A888" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#s-soft)" opacity="0.7"/>

  <!-- Head -->
  <ellipse cx="193" cy="17" rx="17" ry="15" fill="#C8B898" filter="url(#s-disp)" opacity="0.88"/>
  <path d="M184,17 Q193,12 202,17" stroke="#E8D8BC" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Chisel highlight -->
  <path d="M176,36 Q190,28 204,36" stroke="#E8D8BC" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M179,40 Q190,33 201,40" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
