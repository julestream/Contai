<svg viewBox="0 0 390 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="p-disp">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="p-soft">
      <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="390" height="100" fill="#FFFFFF"/>

  <!-- Cadmium orange sweeps -->
  <path d="M20,78 Q70,40 135,36 Q190,33 232,48 Q262,58 293,46" stroke="#C55A10" stroke-width="13" fill="none" stroke-linecap="round" filter="url(#p-disp)" opacity="0.9"/>
  <path d="M30,82 Q88,46 147,42 Q198,39 241,52" stroke="#D9722A" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#p-soft)" opacity="0.8"/>
  <path d="M45,74 Q102,42 162,39 Q217,37 256,50 Q280,57 312,48" stroke="#F0984A" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#p-disp)" opacity="0.75"/>

  <!-- Cobalt blue counter-strokes -->
  <path d="M28,46 Q78,67 134,74 Q186,81 238,71 Q274,65 312,74" stroke="#2A5A9A" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#p-disp)" opacity="0.7"/>
  <path d="M36,42 Q90,63 143,71 Q193,77 244,67" stroke="#4878BC" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#p-soft)" opacity="0.6"/>

  <!-- Viridian accent -->
  <path d="M256,28 Q293,44 323,63 Q342,73 360,66" stroke="#2A7A58" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#p-soft)" opacity="0.65"/>
  <path d="M262,32 Q298,47 330,66" stroke="#3A9A6E" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#p-disp)" opacity="0.55"/>

  <!-- Impasto white highlight -->
  <path d="M140,52 Q180,42 220,46" stroke="#F5EED8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.92"/>
  <path d="M147,55 Q182,47 215,50" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>

  <!-- Palette knife lozenge -->
  <path d="M318,27 L338,33 L341,42 L321,36 Z" fill="#F0984A" opacity="0.88"/>
  <path d="M320,28 L337,33" stroke="#FDECD0" stroke-width="1" opacity="0.6"/>

  <!-- Paint drip -->
  <path d="M210,80 Q212,87 210,94 Q209,98 211,100" stroke="#C55A10" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65"/>
</svg>
