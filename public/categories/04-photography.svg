<svg viewBox="0 0 390 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ph-disp">
      <feTurbulence type="fractalNoise" baseFrequency="0.52" numOctaves="3" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ph-soft">
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="390" height="100" fill="#FFFFFF"/>

  <!-- Horizon light -->
  <path d="M28,38 Q120,31 195,34 Q274,36 358,30" stroke="#ACA498" stroke-width="13" fill="none" stroke-linecap="round" filter="url(#ph-disp)" opacity="0.7"/>
  <path d="M34,37 Q124,30 197,33 Q275,35 354,29" stroke="#C8C0B0" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#ph-soft)" opacity="0.6"/>

  <!-- Building masses -->
  <path d="M72,84 Q71,62 73,43 Q74,34 75,27" stroke="#5A5448" stroke-width="15" fill="none" stroke-linecap="round" filter="url(#ph-disp)" opacity="0.85"/>
  <path d="M100,84 Q99,59 101,40 Q102,30 102,20" stroke="#4A4440" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#ph-soft)" opacity="0.8"/>
  <path d="M124,84 Q123,63 124,45 Q125,35 126,28" stroke="#5E5650" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#ph-disp)" opacity="0.75"/>
  <path d="M183,84 Q182,60 183,42 Q184,30 185,22" stroke="#484038" stroke-width="13" fill="none" stroke-linecap="round" filter="url(#ph-soft)" opacity="0.8"/>
  <path d="M210,84 Q209,62 210,45 Q211,34 212,26" stroke="#6A6258" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#ph-disp)" opacity="0.7"/>
  <path d="M268,84 Q268,63 269,46 Q270,36 271,28" stroke="#504848" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#ph-soft)" opacity="0.75"/>
  <path d="M299,84 Q299,64 300,48 Q300,38 301,30" stroke="#5C5450" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#ph-disp)" opacity="0.7"/>

  <!-- Ground -->
  <path d="M0,85 Q195,82 390,85 L390,100 L0,100 Z" fill="#FFFFFF"/>
  <path d="M18,84 Q195,81 372,84" stroke="#2E2A26" stroke-width="3.5" fill="none" filter="url(#ph-soft)" opacity="0.8"/>

  <!-- Lit window -->
  <ellipse cx="184" cy="51" rx="5" ry="4" fill="#D8B870" opacity="0.9" filter="url(#ph-soft)"/>
  <ellipse cx="184" cy="51" rx="3" ry="2" fill="#F5DFA0" opacity="0.95"/>

  <!-- Lone figure -->
  <path d="M194,85 Q194,77 194,73" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.95"/>
  <ellipse cx="194" cy="71" rx="3" ry="3" fill="#FFFFFF" opacity="0.95"/>

  <!-- Sky highlight -->
  <path d="M146,17 Q195,13 244,16" stroke="#D8D0C0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M150,20 Q195,16 240,19" stroke="#EEE8D8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.55"/>
</svg>
